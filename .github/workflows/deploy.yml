# Smoke post-deploy: no despliega.
# Production la publica solo la integración Git de Vercel.
name: Deploy → Producción

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  smoke-prod:
    name: smoke-prod
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://ecommerce-graficasnasve.vercel.app
    steps:
      - name: HTTP 200 en Production
        run: |
          set -euo pipefail
          URL='https://ecommerce-graficasnasve.vercel.app'
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo '000')
            echo "Intento $i → HTTP $CODE"
            if [ "$CODE" = '200' ]; then
              echo "✅ Production responde 200: $URL"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error::Production no respondió 200 tras reintentos ($URL)"
          exit 1
