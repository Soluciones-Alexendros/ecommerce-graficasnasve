allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# Scripts de build (pnpm): se permiten porque necesitan/empaquetan binarios
# nativos por plataforma; esbuild es imprescindible para Vitest.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
# Fuerza una única versión de Vite para evitar el conflicto de tipos entre
# vitest/config y @vitejs/plugin-react (que arrastraban vite 7 y vite 6).
# Overrides de seguridad: parches críticos/altos de Dependabot y pnpm audit.
overrides:
  vite: 6.4.5
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2 <2.1.7': 2.1.7
  'brace-expansion@>=3 <5.0.12': 5.0.12
  browserslist: 4.29.4
  'fast-uri@3': 3.1.9
  'js-yaml@4': 4.3.2
  'nanoid@3': 3.3.20
  'postcss@<=8.5.17': 8.5.31
  engine.io: 6.6.11
  socket.io-parser: 4.2.7
  ws: 8.22.0
  source-map-js: 1.2.2
  'undici@7': 7.30.1
  'zod@<4.6.6': 4.6.7
  sharp: 0.35.5
